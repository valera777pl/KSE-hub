<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F3F7" />
    <meta name="description" content="KSE Hub — Telegram Mini App for Kyiv School of Economics students" />
    <title>KSE Hub</title>
    <script>
      /* Light or dark before the first frame, without waiting for any script:
         the theme pinned in Профіль, else Telegram's (its bg colour arrives in the URL), else the system's. */
      (function () {
        var dark = false;
        try {
          var pinned = localStorage.getItem('kh:theme');
          if (pinned === 'dark' || pinned === 'light') dark = pinned === 'dark';
          else {
            var m = /tgWebAppThemeParams=([^&]*)/.exec(location.hash);
            var bg = m && JSON.parse(decodeURIComponent(m[1])).bg_color;
            var q = /[?&]theme=(dark|light)/.exec(location.search);
            if (bg) { var n = parseInt(bg.slice(1), 16); dark = ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 < 128; }
            else if (q) dark = q[1] === 'dark';
            else dark = matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } catch (e) { /* storage or URL unreadable: light */ }
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = root.dataset.theme;
        root.style.background = dark ? '#0B0D12' : '#F2F3F7';
        document.querySelector('meta[name=theme-color]').content = dark ? '#0B0D12' : '#F2F3F7';
      })();
    </script>
    <style>
      /* Splash (DESIGN.md → Splash): the «Сьогодні» mark with today's date, a soft KSE-blue glow under it, a slow breath */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #F2F3F7; transition: opacity 220ms cubic-bezier(0.2, 0, 0, 1); }
      [data-theme='dark'] #splash { background: #0B0D12; }
      #splash.splash--out { opacity: 0; pointer-events: none; }
      .splash__glow { position: absolute; width: 440px; height: 440px; border-radius: 50%; background: radial-gradient(closest-side, rgba(43, 59, 214, 0.22), rgba(43, 59, 214, 0.08) 55%, rgba(43, 59, 214, 0)); }
      [data-theme='dark'] .splash__glow { background: radial-gradient(closest-side, rgba(54, 69, 242, 0.34), rgba(54, 69, 242, 0.12) 55%, rgba(54, 69, 242, 0)); }
      .splash__mark { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: splash-breathe 1.6s ease-in-out infinite alternate; }
      .splash__day { width: 76px; height: 76px; border-radius: 20px; background: #2B3BD6; color: #fff; display: grid; place-items: center;
        font: 700 34px/1 -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; position: relative; }
      [data-theme='dark'] .splash__day { background: #3645F2; }
      /* The two rings of a calendar page, as on the tab icon */
      .splash__day::before, .splash__day::after { content: ''; position: absolute; top: -6px; width: 6px; height: 13px; border-radius: 3px; background: inherit; }
      .splash__day::before { left: 20px; }
      .splash__day::after { right: 20px; }
      .splash__name { font: 600 15px/1 -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Segoe UI', system-ui, sans-serif; color: #5F6675; letter-spacing: 0.01em; }
      [data-theme='dark'] .splash__name { color: #A0A7B4; }
      @keyframes splash-breathe { from { transform: scale(0.98); } to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .splash__mark { animation: none; } #splash { transition: none; } }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash__glow"></div>
      <div class="splash__mark">
        <div class="splash__day" id="splash-day"></div>
        <div class="splash__name">KSE Hub</div>
      </div>
    </div>
    <script>
      try { document.getElementById('splash-day').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Kyiv', day: 'numeric' }).format(new Date()); } catch (e) { /* old browser: an empty mark */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Free scheduler for the bot: Vercel Hobby only allows daily crons, so GitHub
# calls /cron/tick every 10 minutes (deadline reminders, digests, Moodle sync).
# Needs repo secrets APP_URL (https://<project>.vercel.app) and CRON_SECRET.
name: cron-tick

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /cron/tick
        run: |
          curl -fsS --max-time 280 -X POST "${{ secrets.APP_URL }}/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

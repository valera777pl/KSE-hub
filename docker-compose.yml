version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kse_hub_db
    environment:
      POSTGRES_USER: kse_hub
      POSTGRES_PASSWORD: kse_hub_secret
      POSTGRES_DB: kse_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kse_hub"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kse_hub_api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kse_hub:kse_hub_secret@postgres:5432/kse_hub
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kse_hub_client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
